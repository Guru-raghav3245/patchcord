name: Patchcord
options:
  deploymentTarget: {macOS: "12.0"}
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_DEBUG_DYLIB: NO
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO  # else ad-hoc Release builds ship get-task-allow (debugger attach)
targets:
  Patchcord:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gururaghav.patchcord
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Patchcord
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/vendor/prefix/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/vendor/prefix/lib
        OTHER_LDFLAGS: [-lmtp]
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: NO
    postBuildScripts:
      - name: Bundle dylibs
        script: '"$SRCROOT/scripts/bundle-libs.sh"'
        basedOnDependencyAnalysis: false
